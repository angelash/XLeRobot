10-21","title":"核对套件，建立打印工坊路线和可复查的改件","status":"采购评估与设计","summary":"继续核对套餐与配件，生成低位前伸接口的参数化首件；打印机建议根据用户提供的实际价格从 P2S 转向 X2D。","progress":["围绕套餐一、套餐二、推车、电源、三路相机和底盘舵机交付内容核对卖家信息；卖家陈述与实物清点仍分开记录。","制作低位前伸接口的参数化 CAD、STL/STEP 等输出，保留上游结构，准备后续干装核对。","讨论办公室打印的噪声、气味、材料与通风条件，没有把过滤配置当作现场排放验收。","根据当日截图比较 X2D 多色套装 3994.15 元与 P2S 套装 3318.40 元，并归档价格口径；未据此认定已购买打印机。","配套维护对 C–F 盘做清点，随后按当时授权迁移旧模型与备份、清理缓存；这些是工作站维护记录。"],"problems":["卖家套餐描述中的底盘舵机数与本地双轮代码不同，必须留待实物核对。","打印支架的孔距、受力、走线、重心及办公室环境尚未进行物理试装或测量。"],"outcome":"有可复查的模型、工坊路线和历史比价材料；当日记录不能证明打印机已到货或支架已打印成功。","next":["到货时优先清点电源、控制板、舵机和损伤线缆。","打印前复核真实孔距和材料，再做干装。"],"lessons":["价格要比较同一 SKU、同一优惠口径。","文件可生成、可切片，与结构已合格是不同阶段。"],"sources":["S01","S05"],"commits":[],"evidence":["FABRICATION_ROADMAP.md","fabrication/cad/xlerobot_low_front_prototype.py","fabrication/purchasing/X2D_PRICE_HISTORY.md"],"cutoff":"2026-11-03 14:46"},{"date":"2026-10-23","title":"套件到货，进入边装边排查的装配阶段","status":"到货与装配指导","summary":"根据用户提供的到货照片制定装配指南，把关键清点压缩到控制板、电源、轮组舵机和疑似受损线缆。","progress":["归档到货照片与首轮外观判断。主要机械件可见，遮挡处的数量和状态仍记为待核验。","整理官方双轮资料、通用双臂装配资料与视频，指出三全向轮教程不能直接套用于双轮底盘。","制定推车、轮组、上部底座、双臂与头部、电脑只读检测、分级动作测试的顺序。","保留二手设备已有编号与装配状态，先读取，不先恢复出厂或重新编号。"],"problems":["盒子数量不能当作电机数量，照片看不全不能直接认定齐套。","疑似露芯线缆和电源输出/极性需要实物确认后才可接电。"],"outcome":"装配指导与到货台账已落地；尚未形成全机通电、三路成像或机械行程验收。","next":["先装推车和轮组，检查机械干涉与线束余量。","连接电脑后逐板只读扫描，再考虑小范围动作。"],"lessons":["关键危险项认真清点，其余小配件可以随装配逐步确认。","版本和实物决定接线与配置，不能仅按套餐文案启动整机。"],"sources":["S01"],"commits":[],"evidence":["fabrication/assembly/ASSEMBLY_GUIDE_ZH.md","PROJECT_STATE.md"],"cutoff":"2026-11-03 14:46"},{"date":"2026-10-27","title":"双板从单侧异常恢复，搭起只读调试台","status":"接线与只读检测","summary":"先定位 USB、供电和串口占用问题，随后读到两块板共 16 个电机，开始把设备状态和动作许可做成可视面板。","progress":["早期 COM3 可读、COM4 打不开；COM3 反馈电压从约 5V 变为正常 12V，表明动力供电与 USB 枚举需要分开检查。","识别另一程序占用串口的情况，保持已有程序与现场状态，避免同时争抢总线。","双板恢复后，COM3 的 ID 1–8、COM4 的 ID 1–6/9/10 均有应答，共 16 个电机。","创建本地只读调试台，展示舵机遥测、相机、手柄输入，以及观测/校准/受限控制许可。","用户断开设备后准备受限控制软件：当前位置保持、按键单步、停止和断连处理，并补齐实时状态反馈。"],"problems":["串口存在不等于能打开，USB 供电存在不等于舵机动力供电正常。","网页能看到手柄输入，仍不能证明电机已收到可执行命令。"],"outcome":"两板与电机拓扑已得到只读确认，受限控制软件就绪；没有据此认定完整手柄实机控制已通过。","next":["确认物理左右臂、关节与编号对应。","保持单一串口所有者，先做当前位置保持和小步验证。"],"lessons":["把设备在线、动作许可、输入、下发与实际反馈分开显示。","逐层排查 USB、动力供电、串口占用和总线应答。"],"sources":["S01","S02"],"commits":[],"evidence":["fabrication/assembly/debug_console/","PROJECT_STATE.md"],"cutoff":"2026-11-03 14:46"},{"date":"2026-10-28","title":"修通手柄到编码器的链路，并接入原版整机映射","status":"控制链路实测","summary":"在多次“页面看似正常但设备不动”之后，找到校准格式、步长、串口争用与后台输入问题，以实际编码器变化完成局部验收。","progress":["按用户授权打开 16 个电机的当前位置保持扭矩，并回读零速与位置变化；与主动移动分开记录。","补齐初始校准与运行服务读取逻辑，排除旧服务仍在响应、浏览器手柄状态判断不一致的问题。","统一串口管理并改用 Windows XInput。虚拟 Xbox 经过真实控制服务驱动肩部编码器 1998→2008→1995，左腕也有小幅往返反馈。","升级完整手柄映射、输入/目标/反馈日志、限位提示与暂停恢复体验，保留用户接管。","按照用户选择落地上游 Xbox 控制语义；原版软件预览可用，但完整实机仍缺真实行程和运动学参考。","切换 origin 为个人维护仓库并保留 upstream。另在 open-share 验证百度网盘 CLI 路径和带回读校验的通用备份流程。"],"problems":["早期把“目标写入但未动”过早归因于舵机本体，后续发现仍有控制链路问题；保留这个误判。","当天存在未经当次审批的扭矩试验后复位记录；后续明确区分保持、动作和接管授权，不能用历史授权替代当前边界。","初始保持窗口不等于完整机械行程；预览模式和已跑通局部关节不等于整机可用。"],"outcome":"局部手柄控制得到实机反馈验证，原版整机映射完成软件首版；底盘与末端联动仍待分项验收。","next":["采集真实关节范围，补运动学参考。","迁移到车载电脑前保留参数与证据，继续用分项验收约束结论。"],"lessons":["验收完整链路要看到实际编码器变化和停止行为。","校准就绪、扭矩打开、接管开启、设备运动是四种不同状态。","明确复核动作授权，并保存误判和纠正过程。"],"sources":["S01","S02","S04"],"commits":["206d1af","77858","ef76b26"],"evidence":["PROJECT_STATE.md","fabrication/assembly/debug_console/"],"cutoff":"2026-11-03 14:46"},{"date":"2026-10-29","title":"Studio 与车载 Windows 部署落地，整机控制继续补课","status":"车载部署与实测","summary":"8770 Studio 成为统一入口；车载笔记本完成真实 SSH、局域网访问与设备监控。能部署、能读电机之后，仍花了多轮排查把控制准备和行程采集做实。","progress":["Studio 首版整合 9 个工作区、20 项能力、14 篇手册，明确可用工具、待适配能力和社区参考。","按用户新的方案改用车载 Windows 笔记本，取代早期手机加小主机建议；准备离线环境与迁移资料。","核对 SSH 主机指纹后真实连接。先做隔离预览，再验收笔记本 8770 的局域网直连、防火墙及同源接口。","车载监控读取 COM8/COM9 共 16 个电机、三路相机和 Xbox；用 USB 身份而非固定 COM 号绑定控制板。","逐电机测试先为 9/16 通过，进一步修复后为 12/16；整机尚不能因此宣布完成。","发现同固件舵机写位置目标可能自动使能扭矩，修复保持、回中和停止路径，保留卸力关节。","构建真实行程与姿态卡采集，增加左右臂对调、物理车轮定义、自由顺序保存、故障隔离和中断恢复。","用户关机后完成预设直控与交互复查；发现第一版仍被旧 ±32 计数窗口限制，再次修正。制作 10 月 29 日的旧版证据快照，并按要求让笔记本休眠。"],"problems":["建立接管会话却未准备实机扭矩、到位后误报“未移动”、旧标定过窄，都会导致用户看见输入而设备不动。","左右逻辑对调后参考姿态必须仍绑定物理手臂，不能只交换界面文字。","晚间对预设直控的修复在断开设备后完成，当时没有实机复验。"],"outcome":"车载运行、网络和设备监控已实测；低速局部控制可用。完整整机末端联动、精确参考及晚间改动仍有待验收项。","next":["设备恢复后部署昨晚修复，写入真实行程。","逐步补全整机运动学参考，避免把调节向导做成无法试用的前置障碍。"],"lessons":["源码同步、运行版发布、设备监控和动作验收必须分别记录。","要检查真实监听进程、HTTP 内容与设备反馈，不能只信端口开放或部署成功。","中断和跨日期恢复不能丢失已经采集的姿态与行程。"],"sources":["S01","S03","S06"],"commits":["0974d37","14c8fda","f04c274","496cfc9","b4439a8","7c659e3","c44bac2"],"evidence":["PROJECT_HANDOFF_ZH.md","deployment/windows/README_ZH.md","PROJECT_STATE.md"],"cutoff":"2026-11-03 14:46"},{"date":"2026-10-30","title":"写入行程、修复自检，验证无需登录的开机恢复","status":"限位与部署实测","summary":"前一晚的 14 项行程得到恢复和写入；自检中的退离失败促成竖直姿态方案。Windows 更新重启暴露服务启动问题，随后完成真实无人登录启动验证。","progress":["恢复工作端热点后部署车载版本，修复只搜索当天证据目录的问题，找回前一天 14 项行程并逐颗回读写入。","根据用户反馈修正底盘前后和头部左右方向，改进电压抖动、触限、关节受阻和手柄短断连处理。","完成限位自检界面和分项回执；下午用户运行的一轮为 14 项中 10 项完成、4 项失败，保留失败项原范围。","Windows 更新触发重启导致 8770 不可访问；核查网络与 SSH 正常、服务未启动，再调整更新策略和热点自动关闭设置。","将服务改为开机任务，真实重启到未登录状态后，网页、双板和电机监控恢复；未把这次结果扩大成所有手柄重连都已验证。","新增手动卸力/当前位置锁定。Elite 背键通过 Xbox 配件映射为摇杆按下；不假定 XInput 会直接提供背键。","用竖直起点重跑 4 项失败自检，减少重力与碰车体风险；退离止挡必须看到真实位置变化。","制定助手控制规范与第一轮自主运行设计，设备断开后按要求让笔记本休眠。"],"problems":["顶止挡后退不出来，可能涉及舵机过载降输出、姿态干涉或判据宽松，不能全部当成硬件损坏。","“登录后自启”并不能覆盖更新重启停在登录界面的情形。","手动摆位的部分边界仅通过模拟总线验证，不能统称实机全测。"],"outcome":"行程、自检恢复和开机服务得到多项实机验证，竖直自检方法可复用；自主运行当晚仍处于准备状态。","next":["重新上电后先只读预检，按规范开始第一轮自主观察。","独立验证相机对应、退离判据和全部停止条件。"],"lessons":["碰阻与机械限位要区分，退离成功必须回读确认。","后台启动能力要用真正的重启、未登录、设备读取来验收。"],"sources":["S06"],"commits":["95386c2","b8f23e1","57a374a","9a9ef0c","ebc190e","397d912"],"evidence":["fabrication/assembly/debug_console/AGENT_CONTROL_ZH.md","fabrication/assembly/debug_console/AGENT_ROUND1_ZH.md","PROJECT_STATE.md"],"cutoff":"2026-11-03 14:46"},{"date":"2026-11-02","title":"自主观察、MOSS、整机参考与有限移动并行推进","status":"多模块实测与交付","summary":"第一轮自主观察完成，交叉视角与待审经验制度建立。Studio 增加空间观察、机器人展示、语音和自主学习；短移与建图保留明显限制。","progress":["第一轮自主运行确认头部/左右腕相机对应，补测行程，修正退离与受阻判据。用另一条收起手臂的腕相机从侧面观察前伸手臂，补足笔记本视角。","建立已审核规范、观察手册、待审核经验三层资料；待审核经验默认参与判断，但不能放宽硬性边界。观察手内转造成碰撞的失败也归档。","车载小九桥接、持久会话、去重和超时/取消/崩溃处理落地；完整源码同步与运行发布分开核对。","空间观察从 31 张图/17 项标记发展到 68 张/23 项，最终为 101 张/26 项。先前独立观察服务退役，能力并入 8770。","MOSS 展示接入署名模型、固定吊顶与独立关节，修复局域网消息发送，加入人设、MiniMax 语音和十套待机动作。早期浏览器失败与后续实际页面复验均保留。","语音输入默认关闭，名字唤醒、持久对话和静默交付完成；真实麦克风与有声效果按用户要求留待现场测试。","通过受限自检补齐双臂运动学参考和夹爪端点，验证可启动待机姿态与低速联动；精确定位仍未完成测量标定。","朝过道完成 5 次低速短移，因人和椅子停止，未到开阔过道。后续两次以 5cm 为目标的尝试提前保护停车，编码器估算累计约 3.1cm，未到红线。","增加自主学习、双目标定工具与算力路由；远端只提供加速建议，本地控制器保留最终动作与停车权。"],"problems":["轮 10 动作中曾报告 57°C、停车后 35°C，原因没有查清，自主移动暂停。","手柄操作和轮位变化后地图定位失效；照片方位图、红线和编码器估算都不足以构成可靠地面围栏。","首次展示与关节测试存在失败；不能引用早期未通过的阶段，也不能用后续修复抹去当时失败。","语音链路有 CLI 收尾延迟；静默逻辑通过不代表实际语音体验已验收。"],"outcome":"自主观察、多个 Studio 模块与整机初始化有实测交付；自主导航、可靠围栏、精确定位、通用双目抓取仍未完成。实时避障的部署结果跨到次日记录。","next":["先完成地面/相机标定与避障实物测试，再扩大自主移动。","以实际物品抓取建立可复核经验，区分单目规则和双目测距。"],"lessons":["每段移动都重新观察，遇到本地手柄输入立即让出控制并使旧定位失效。","3D 展示要验独立关节和真实消息往返，结构测试不能代替页面交互。","实时安全判断留在车上，模型和工作站故障不能取消停车保护。"],"sources":["S06","S07","S08","S09","S10","S11"],"commits":["24cf22b","e8426c4","464b97a","aad2b44","6a41a8e","4ecddf1","61ce61a"],"evidence":["fabrication/assembly/debug_console/AGENT_OBSERVATION_ZH.md","fabrication/assembly/debug_console/AGENT_LEARNING_ZH.md","docs/presence/","docs/autonomy/"],"cutoff":"2026-11-03 14:46"},{"date":"2026-11-03","title":"从人工分步抓放到本地识别接班，纠正底盘方向","status":"实物抓放与受限移动","summary":"上午先失败再抓起放回；下午演练暴露进入路径碰倒物体，修复后完成大模型辅助与工作站本地模型各一次快速抓放。底盘方向通过相机重新核实。","progress":["凌晨完成头部单目避障的软件部署和照片评估。部署时硬件不在、没有实时相机和行驶；缺画面、缺标定、数据过期均阻断前进。","09:42–10:33 第一次抓取共 28 次运行、153 张照片。左臂伸到极限仍差约 1–2cm（照片/模型推断），闭合只推走插头；未拿起、未放下。","用户将物品移近后，10:54–12:18 再运行 45 次。约 55° 斜夹多次滑脱，随后改为约 15° 下倾、指尖距桌约 1.4cm、水平推进，夹紧并在同次运行内抬肩。","第二轮实际拿起并保持约 10 秒，再放回、松开、撤离。抬高约 1.5–3cm 为图像估计，不是尺量；底盘全程未主动运动。","以左腕相对物体/背景变化、头部的桌面参照、右腕侧视和影子分离交叉确认提起。两轮合计 73 次运行、474 张照片，肩部最高温度约 41°C。","完成快速抓取设计与代码：8770 做实时跟踪和状态机，8765 做有界伺服会话，避免分次动作清除夹紧力；本机 357 项回归、9 项页面测试通过。","配套维护完成历史 QA 副本迁移，随后按另一条对话中的明确授权删除已迁移的历史副本；日志保留先迁移、再删除的顺序。","14:44以后完成新流程实机预检。仿真未覆盖单步900计数上限，实机第一步被拒绝，修复分段后到观察位；目标太近、腕下盲区导致首次未抓。","15:23演练11步、34.6秒成功送入两指而不闭合；重回观察位时碰倒插头。随后提高观察位并改从后上方进入，保留触碰与路径修正证据。","根据当时新授权设计抓取搬运v2与净后退额度。前三段所谓“后退”实际朝桌子靠近，轮估累计约10.5cm；用头部和右腕画面判定方向错误，修复后先以2cm短段复核。","17:21大模型框选侧躺插头，59.8秒/25步完成抓起、横移放回；18:10工作站CPU上的OWL-ViT三帧识别用时3.4秒，随后59.9秒/24步完成另一轮，全程无需大模型识别。","经典模板在空白桌面也给出高分而被拒绝自动接班。OWL-ViT替代的是目标框选，动作耗时仍主要由机械执行决定，模型运行在工作站而不是车载小电脑。","两腕分别朝左右后方观察，仍有正后方和近轮地面盲区；按当时授权净20cm范围完成后退与四段前进返起点，距离为轮估。最后按用户要求休眠。"],"problems":["第一轮物品在可达范围外，不能靠继续闭合补救；第二轮斜夹和夹紧力跨运行被清除都会导致滑脱。","成功抓取抬得低、夹持负载小，不能证明更重物品或大于 5cm 的提升可靠。","快速抓取离线测试通过，与车载 OpenCV 环境回归、演练和重复实物抓放是不同验收项。","单目地面外观法对浅色障碍仍有漏检风险；地面单应尚未标定。","观察位下落碰倒轻物却未触发contact，说明“未报告受阻”不能证明路径未接触物体。","10月30日手柄方向记录与本日方向核验矛盾，原因未查清；不能把旧映射名称当作当前车头方向证据。","轮温有多次瞬时异常，立即复读恢复；保留毛刺与保护记录，硬件原因尚未解决。"],"outcome":"上午一次分步抓放、下午大模型辅助与工作站本地识别各一次抓放均有物理证据；受限移动完成方向复核与往返。没有完成长期成功率、尺量精度或自主避障验收。","next":["固定物体姿态和夹爪条件，分别验证自动识别、完整抓放与重复成功率。","准备量具或标记物完成地面/双目/里程标定；未通过浅色障碍测试前保留避障阻断。"],"lessons":["先检查可达余量，再夹；在离目标远的位置张开，低位近水平送入。","夹紧、提起、验证和放回应在同一个保持夹持力的执行过程里完成。","相似度单一高分不能单独证明提起，要同时看实际运动与多个相机参照。","新控制方法的仿真要复刻执行器全部约束，端点可达也要检查整条进入路径。","底盘方向应由新鲜多视角变化确认；本地识别接班不等于整个机器人脱离工作站。"],"sources":["S07","S11","S12"],"commits":["715bacb","cc9f768","8b9a129","464ffb9","5c3055a","00f25d1","fff5ca4","7388f47"],"evidence":["PROJECT_STATE.md","docs/autonomy/FAST_GRASP_ZH.md","fabrication/assembly/debug_console/AGENT_LEARNING_ZH.md","docs/autonomy/MANIPULATION_V2_ZH.md","docs/autonomy/MOBILE_OBSERVATION_ZH.md"],"cutoff":"2026-11-05 10:12"},{"date":"2026-11-04","title":"抓放出现连续成功，固定批次却暴露可靠性不足","status":"现场综合测试与可靠性复测","cutoff":"2026-11-05 10:12","summary":"从旧帧恢复、交叉观察和持续夹持中获得多次成功，也通过固定批次保留失败，确认80%目标尚未达到；同色桌面成为明确的避障漏检反例。","progress":["现场无棋盘格和卷尺，继续不依赖度量真值的测试。休眠恢复后相机重复发送旧JPEG，序号与接收时间仍增长；仅恢复所属采集子进程后看到真实新画面，并增加重复内容过期保护。","上午完成四段后退2+5cm、前进5+2cm，轮估回到起点。完成关节读数/拟合候选和共享帧时差采样，均与外部位姿精度、硬件曝光同步分开记录。","第一组为4次自动运行与1次手动试验：仅首次有明确抓起放下证据，其余失败或未确认；运行内重试数与物理尝试数单独保留。","11:21–11:39加入固定右腕侧视，5次工程尝试前2次失败、后3次完成抓放；一次放下后朝向发生变化。提高包覆和受限加压有局部效果。","按用户要求建立物品档案与夹持评估规范，记录材质、表面、估计重量的来源与置信度；只提供候选强度，未建立接触力标定或开放自动调力。","14:56–15:20尝试协调提起、同会话保压和分档释放：6次中3成功、1失败、2未确认，最后3次成功。按实读补偿腕角只作为本场候选方法。","随后预登记白色固定批次A共10次，前4次2成功、2失败，衬条再次疑似松脱后中断；后6次未执行。衬垫修复后平放8次、重摆直立4次均无完整成功，各组分别归档。","用户再次确认衬垫固定，并新增黑色充电头。右臂5次不同策略工程试夹仅1次完成离桌、保持3秒、放回；另一个固定批次前2次低压停止、0/2后中断，余8次未做。","感知吞吐与源龄链路有数据，但白桌ROI约99.98%误判为地面，O2未通过；静止相机中断/过期、工作端离线拒绝动作得到验证，持续自主避障行驶保持不开放。","每组保留独立回执包、源图和失败。当日结束时记录两臂停靠、轮组零速，之后按用户指令休眠；这只是当时状态。"],"problems":["衬条多次松脱与处理使接触条件变化；固定或取下的具体方式、材料与摩擦系数未确认，不能把历史压力终点当当前稳定参数。","两指常推着物体转向，未形成稳定对向包覆；更小闭合目标、更高扭矩上限和插入深度均未单独恢复可靠性。","控制步骤完成、夹持初始负载高或图像相似度高，仍可能没有完全离桌或在试提中失持。观察缺帧与遮挡按未确认保留。","相机重复旧内容、偶发停止更新和轮温跳变的完整硬件/驱动根因仍未闭环；静止故障注入不能替代运动中整控制进程崩溃停车。","与官方演示比较时发现，部分家务任务由人工遥操作完成；本机自动定位、接触控制与任务示范学习条件不同，不能直接横比完成度。"],"outcome":"获得多组可复查的抓放正负例，并落实夹持档案与观察方法。白色固定A仅2/4后中断，修复后的0/8、0/4与黑色固定0/2分别保留；没有达到或证明80%目标，也没有完成自主避障。","next":["先稳定衬垫、对向包覆、观察位和单个动作变量，再冻结独立批次，所有已启动尝试进入分母。","为夹持读数门增加独立成功对照和误拒统计；继续用侧视验证离桌、保持、受控放下。","处理白色障碍漏检并补齐度量标定，保持本地候选不自动晋级为动作策略。"],"lessons":["连续成功只说明当时局部有效，固定批次才检验重复性；失败和未确认不能删。","衬垫、目标朝向或方法改变就另起组，不拼接成功凑比例。","同一有时限执行会话内保持夹持，结束会话的保护性清理会改变原加压目标。","分类、材质和估计重量能辅助选择候选，扭矩百分比与舵机负载都不是牛顿接触力。","链路速度通过不能抵消障碍漏检；旧JPEG内容不应凭新序号获得续期。"],"sources":["S07"],"commits":["e4e25a0","5540b37","564885a","eed0f24","95b7fc1","705de35"],"evidence":["docs/autonomy/TEST_SESSION_20261104_ZH.md","docs/autonomy/CROSS_ARM_GRASP_20261104_ZH.md","docs/autonomy/GRASP_FORCE_POLICY_ZH.md","docs/autonomy/NEW_GRASP_TECHNIQUES_20261104_ZH.md","docs/autonomy/GRASP_RELIABILITY_20261104_ZH.md","docs/autonomy/BLACK_CHARGER_GRASP_20261104_ZH.md"]},{"date":"2026-11-05","title":"本地关节补偿有局部效果，抓取模型仍在候选阶段","status":"上午已完成一轮；午前训练进行中","cutoff":"2026-11-05 10:12","summary":"按新授权开展受限后退、转向和本地学习。头部补偿在笔记本独立执行；轮速和抓取提示验证不足。10:06开始的新训练截至本快照尚未收尾。","progress":["用户授权以当前起点净后退最多50cm并做有限转身。新额度独立记账，不清空旧记录；每段短移、停车后重新观察。","上午第一轮8次后退指令，首次5cm请求超时后停车，后7段完成；额度保守占34/50cm，七段轮估28.59cm，首次实际距离未知。六次小角转向后原航向没有外部复核，随后未平移。","三场采集72个关节样本，48训练、24留出，头水平与当时右肩水平的局部补偿候选最大残差2.17计数，未默认采用。笔记本独立读模型并执行12次头部补偿，最大实读误差2计数、平均绝对0.5计数。","轮速4次训练、3次整段留出；留出R²为0.893，低于0.98门槛，不采用，也不称地面距离或转角标定。","抓取结果提示用19个历史白色物理尝试训练、7个黑色整组留出，6/7一致，却漏判唯一成功；与全部预测失败的基线相同，保持candidate/shadow_only且无动作权限。","纯Python本地读模型和推断中位1.08ms、HTTP端到端17.11ms；已有经典跟踪在腕部小转动下88次状态有效，中位11.4ms。这不是新神经网络、自动类别识别或深度测距。","09:30第一轮收尾为两臂收起、双轮零目标零速、无活动会话；底盘留在后退位置，没有声称回到起点。64项车载聚焦回归通过，643份回执文件独立下载校验。","10:06用户追加午前抓取和移动训练，目标80%。截至10:12，只看到前两段前进正常、第三段因温度读数多次跳变停车；即时复读恢复34°C，正在静止采样排查。尚无此轮抓放结果或最终停靠。","本次继续归档拉取同样12条会话，较前批新增237条用户/助手消息，其中21条用户消息。11月3日补下午，11月4日新增全日复盘，11月5日明确标为截至时点。"],"problems":["计数短移和一维授权台账不提供真实地面位置、原航向或无障碍保证；超时段必须保守占额度。","85.7%的标签一致率看似高，但没有识别出留出成功，不能当抓取成功率或有用的成功预测。","局部头关节编码器误差改善不等于末端毫米精度，不适用于任意姿态、负载、速度或全部关节。","本日午前训练尚在执行；成功率目标、后续抓放与停车状态均不能提前写成结果。"],"outcome":"确认笔记本独立运行的局部头部补偿与既有视觉跟踪有时效数据；抓放提示和轮速模型仍未通过晋级，未获得新的抓放成功率。午前第二轮仅归档截至10:12已发生的过程。","next":["后续归档时补齐午前第二轮的失败、成功、实际授权额度和收尾，不覆盖本次快照。","模型继续按物理尝试/场次留出，与简单基线比较，补足成功召回、误报和未知样本。","固定抓取接触条件后再开展新的预登记批次；外部距离与转角真值仍待量具或标记。"],"lessons":["模型有多快和模型有没有用是两种验证；基线、成功召回与独立样本都必须报告。","已训练、已验证、已采用、已执行应分别记录，本地候选不因推断快而取得动作权。","归档活跃任务要明确截止时间，过程记录不能冒充整轮完成。"],"sources":["S07","S12"],"commits":["a687d0f"],"evidence":["docs/autonomy/AUTONOMOUS_LEARNING_20261105_ZH.md","docs/autonomy/LEARNING_PROTOCOLS_ZH.md","PROJECT_STATE.md"]}],"lessons":[{"title":"先建立台账，再讨论改装","dates":["2026-10-20","2026-10-23"],"problem":"已有、候选、已购和已验证的设备容易在长对话里混在一起。","method":"每次追加日期，标明用户陈述、公开规格、本机核验或实物测试；旧方案被替代时仍保留原记录。","limit":"二手商品图片、价格截图与卖家承诺只代表当时证据，不能当作收货或性能证明。","sources":["S01"]},{"title":"用仿真淘汰方案，用实物确认结构","dates":["2026-10-20","2026-10-21"],"problem":"看起来降低托盘就能捡地面物体，模型却仍有明显可达缺口。","method":"保留原模型，建立派生场景比较安装高度、前伸和下翻；把最有希望的方案做成参数化首件，再测孔距、走线、承载与重心。","limit":"几何可达、无碰撞、打印成功与实际抓取稳定是不同结果。","sources":["S01"]},{"title":"控制链路要验证到真实反馈","dates":["2026-10-27","2026-10-28","2026-10-29"],"problem":"网页有输入、命令能写入，设备仍可能完全不动。","method":"逐层观察输入、模式、许可、目标、扭矩和编码器反馈；统一串口所有者，并把到位、触限、受阻与断连区别显示。","limit":"少数关节通过不能推导整机末端控制或底盘方向通过。","sources":["S01","S02","S06"]},{"title":"用 USB 身份迁移设备，分别验源码与运行版","dates":["2026-10-29","2026-11-02"],"problem":"换电脑后 COM 编号变化，源码同步也不保证服务已运行新版。","method":"按控制板 USB 身份绑定；部署前核对旧文件哈希、保留回滚；再查实际进程、HTTP、设备读取和页面行为。","limit":"镜像/离线包、自检、发布、重启恢复与现场动作需要各自证据。","sources":["S06","S07"]},{"title":"限位探测要允许失败并证明退离","dates":["2026-10-30","2026-11-02"],"problem":"顶住不动可能是机械止挡、姿态接触、重力或过载降输出。","method":"先选干涉较少的姿态，结合负载、位置和多视角观察判断；退离必须回读实际变化，失败保留原参数与事件记录。","limit":"本条是复盘方法，具体扭矩、限位与动作权限仍执行当前已审核规范。","sources":["S06"]},{"title":"相机视角是一项需要验证的能力","dates":["2026-11-02","2026-11-03"],"problem":"正面笔记本相机看不出前后姿态，单个腕相机会遮挡接触点。","method":"记录头部和腕相机对应，使用斜侧笔记本和收起观察臂补视角；动作前重新拍基准，并确认观察臂本身不会干涉。","limit":"交叉观察有盲区，观察臂也曾碰撞；已有参考角不自动适用于新摆位。","sources":["S06","S07"]},{"title":"地图随接管和位移失效","dates":["2026-11-02"],"problem":"照片方位图和编码器估算容易被误当作可导航地图。","method":"每段停车后重新观察；有人靠近就停，本地手柄操作后立即让出控制并将旧定位标为历史。","limit":"未标定的照片红线、环扫和轮位不能构成厘米级围栏；本轮没有完成自主导航。","sources":["S07"]},{"title":"安全闭环放在机器人本地","dates":["2026-11-02","2026-11-03"],"problem":"大模型和远端算力有延迟、超时、断网和崩溃。","method":"远端只给建议，本地执行器检查新鲜度、租约、范围与停止条件；观察缺失即阻断，并避免恢复时自动重放旧动作。","limit":"软件保护通过不等于可靠避障；浅色目标、实时相机与地面标定仍需实物验收。","sources":["S07"]},{"title":"界面交付要验用户真正经过的路径","dates":["2026-10-29","2026-11-02"],"problem":"单元测试通过时，用户仍会遇到旧服务、隐藏门控、局域网 HTTP 限制或模型整体乱转。","method":"从真实访问入口验证发送和收到回复、关节独立转动、配置读写、输入许可与状态恢复；错误直接指向可处理的位置。","limit":"结构检查、截图和模拟页面各有用途，不能替代全部真实交互验收。","sources":["S06","S08","S09"]},{"title":"抓取先确认够得着，再决定怎么夹","dates":["2026-11-03"],"problem":"第一轮手臂已经伸到极限，闭合只会推走仍在指尖外的物体。","method":"先检查可达余量，远处张开夹爪；近水平、低位推进，让物体进入两指之间，再夹紧提起。","limit":"约 1.4cm 指尖高度、约 15° 下倾来自这次桌面和插头条件，不是通用抓取参数。","sources":["S07"]},{"title":"把抓取过程做成持续保持的执行会话","dates":["2026-11-03"],"problem":"分次运行清除夹紧力，斜夹还会让两指沿物体滑脱。","method":"夹紧、加压、提起、观察和放回在同一保持过程内完成；用物体相对夹爪、桌面和另一视角的变化交叉确认。","limit":"这次一次成功仅抬高约 1.5–3cm；模板相似度是辅助证据，需同时看到实际动作，重复成功率尚待统计。","sources":["S07"]},{"title":"原始资料、阅读日志与分享稿分别保留","dates":["2026-10-28","2026-10-29","2026-11-03","2026-11-05"],"problem":"长对话、分叉继承和遗漏附件会让经验回顾失真，直接分享原文还可能带出凭据与私人画面。","method":"保存原始字节和来源清单，阅读时去除重复继承，用统一时区分日；分享稿只带复核后的结论。跨盘备份后从 ZIP 逐文件读回并核对 SHA-256。","limit":"F 盘快照之外另存 E 盘，并在另一物理硬盘的 G 盘保留校验副本；都在本机，没有上传网盘。27 个图片原文件可读，另外 6 个从会话内嵌图恢复，只能确认恢复了当时送入会话的版本。","sources":["S04","S06","S12"]},{"title":"给新算法复刻完整执行约束","dates":["2026-11-03"],"problem":"离线全部通过，实机第一步却因单步跨度超限被拒；观察路径还能扫倒轻物而没有contact。","method":"仿真复刻跨度、时限和限位检查，按实际回读细分路径；从后上方进入观察位，并检查物体占据空间。","limit":"端点可达、没有contact和几何桌面余量各自都不能证明整条实际路径无接触。","sources":["S07"]},{"title":"移动方向与授权额度要有新证据","dates":["2026-11-03","2026-11-05"],"problem":"旧“前进”定义与当前车头相反；超时段的真实位移又不能精确还原。","method":"用新鲜多视角短段确认方向，并持久记录每轮授权起点和净位置；超时保留轨迹、保守占额度，转向后重新核实航向。","limit":"轮估、一维台账和红线图片不替代地面距离、航向和盲区测量。","sources":["S07"]},{"title":"图像新鲜度要看源内容","dates":["2026-11-04"],"problem":"休眠后同一张旧JPEG被高速重发，序号、接收时间和表面帧率都在增长。","method":"保留采集源时间，重复内容不续期；操作前核对必要视角，新图缺失就保持，恢复采集后重新观察。","limit":"共享快照时差不是同步曝光；相机恢复也不代表驱动根因已经排除。","sources":["S07"]},{"title":"不要把工程成功拼成固定批次成功率","dates":["2026-11-04"],"problem":"后三次连续成功看似稳定，但固定白色批次仅2/4后因衬垫异常中断。","method":"先冻结成功定义、参数、物体和硬件条件；保留所有已启动、失败和未确认，条件改变另起组，未执行部分如实列出。","limit":"2/4、0/8、0/4和0/2属于不同组，不能合并为一个通用比例，也不能挑选窗口声称80%。","sources":["S07"]},{"title":"把夹持建立、保持、提起与释放分开验","dates":["2026-11-04"],"problem":"闭合负载像成功样本，第二段试提却明显下降，物体仍留桌；衬垫变化后旧角度不再可靠。","method":"先形成对向包覆，再同会话持续夹持，小段试提并用固定侧视确认离桌；最后低处逐档释放，空爪撤离后复查。","limit":"原始负载、目标领先和扭矩上限都不是接触力。新的读数门需要成功对照与误拒统计，不能仅凭负例晋级。","sources":["S07"]},{"title":"对照简单基线，防止高一致率误导","dates":["2026-11-05"],"problem":"结果提示模型6/7一致却把唯一成功判为失败，全部判失败也能得到同分。","method":"按独立物理尝试和不同场次留出，同时报告成功召回、误报、未知及基线；未通过继续旁路，不让模型预测反过来充当真值。","limit":"分类一致率、抓放成功率与动作安全是不同指标；当前样本不能证明模型会辨别成功。","sources":["S07"]},{"title":"明确“本地”究竟在哪台机器运行","dates":["2026-11-03","2026-11-05"],"problem":"工作站OWL-ViT识别被笼统说成本地接班，容易被理解为车载完全独立；小范围编码器补偿也容易被扩大为末端精度。","method":"记录模型、执行端、输入输出、耗时与适用关节；分别证明工作站识别与车载独立补偿，不混写部署边界。","limit":"OWL-ViT这批在工作站CPU上，头部补偿这批在笔记本；各自成功不代表整机无网独立完成通用任务。","sources":["S07"]}],"story_outline":["从已有设备出发：为什么选双轮版，怎样避免一次买齐所有候选硬件。","仿真推翻直觉：两层推车为什么仍够不到地面，低位前伸为何值得继续验证。","从“网页有反应”到电机真的动：输入、权限、串口、扭矩与反馈的分层排查。","让机器人离开工作电脑：车载 Windows、统一 Studio、实际重启与源码发布。","把失败变成经验：退离失败、观察手碰撞、定位失效与第一次抓取失败。","一次能证明什么：第二轮插头抓取的交叉证据，以及距离通用快速抓取还有多远。","从三连成功到2/4中断：为什么预登记、保留负例与硬件条件比好看的演示更重要。","6/7一致却没有识别出成功：怎样用基线与独立留出检查所谓“直觉模型”。"],"cutoff_utc":"2026-11-05T02:12:46.054225+00:00","batch_id":"20261105","inventory":{"XLeRobot":7,"open-share":9,"excluded_open_share":["开源游戏目录","视频转写","通用工程提交","视频修复工具讨论"]},"batches":[{"id":"20261103","cutoff":"2026-11-03 14:46","threads":12,"messages":1186,"user_messages":150,"turns":124,"recorded_days":9,"calendar_days":15,"bytes":215752651,"files":956,"sha256":"45b06d25debed9fa1230d6904504dbacf42c980f0db7a450add866082a4e8ac2","primary":"E:/ColdArchive/2026-11-03/XLeRobot-conversations-20261103.zip","secondary":"G:/RobotBackups/2026-11-03/XLeRobot-conversations-20261103.zip","receipt":"receipts/2026-11-03.md"},{"id":"20261105","cutoff":"2026-11-05 10:12","threads":12,"messages":1423,"user_messages":171,"turns":141,"recorded_days":11,"calendar_days":17,"primary":"E:/ColdArchive/2026-11-05/XLeRobot-conversations-20261105.zip","secondary":"G:/RobotBackups/2026-11-05/XLeRobot-conversations-20261105.zip","receipt":"BACKUP_RECEIPT.md","bytes":447910230,"files":6574,"sha256":"102cde704888c76e8ee03e280099d33f9b209b67330df3bd22006db6d03f441d"}],"current_boundaries":["快速抓放已有大模型辅助和工作站本地 OWL-ViT 各一次实物抓放；编码器与照片估计的厘米值仍未尺量。","11月4日出现多组工程成功，但固定白色批次A仅2/4后中断；修复后平放0/8、直立0/4；黑色固定批次0/2后中断，80%目标尚未达到。","11月5日笔记本独立执行12步局部头部补偿，最大误差2计数；抓取提示与轮速模型未通过晋级，继续保留候选。","11月5日午前训练截至10:12仍在进行，已见温度读数跳变触发停车；尚无这轮抓取完成结果。","白桌面被单目外观法误判为地面，可靠避障、外部位置/角度标定和完整无人导航仍未验收。"],"sharing_boundaries":["不同物体、衬垫、姿态、动作和会话条件分组记录；工程试验、固定批次与重试后任务率不能混算。","工作站本地识别与笔记本独立运行是不同部署条件；6/7预测一致率不是抓取成功率，也没有超过全判失败基线。","所有厘米、模型角度和抬升高度如未尺量则明确标为估算；双腕交叉观察未成为已标定双目测距。","图像源龄、吞吐和静止故障注入通过，不能抵消障碍漏检或替代行驶中崩溃停车验收。","本稿不含账号凭据与现场原图；历史价格、规格和采购建议仅代表当时记录。"],"coverage_notes":["旧版open-share失效路径索引从129增至131，新增加的两条均是财经定时任务，不属于此次机器人会话；全部条目保留在私人discovery.json，仍不能宣称旧版所有历史已恢复。","当前12条选中会话均可读；前次12份原始文件的字节前缀与本次对应文件全部匹配。两条会话新增237条用户/助手消息，其中用户21条，另外10条没有新增消息。","支持材料只从工作电脑已有目录收集，按文件记录哈希、源修改时间和复制时间；活跃证据文件晚于对话截止或读途中变化则跳过。项目台账/报告允许另存采样时版本并明确时间，不能据此回填截止之后的对话结果。","截至10:12，S07午前训练和S12此次归档仍在进行。只记录已看到的过程，不把12点目标、后续抓放或最终停靠写成已完成。","原始对话、现场图片、工具输出和私有运行记录仅保存在Git忽略目录与E/G备份。公开层是整理后的文本，不复制模型权重、账号配置、私钥或虚拟环境。"],"calendar":[{"date":"2026-10-20","title":"找到项目，跑通仿真，开始评估采购与低位改装","status":"研究与仿真","summary":"从寻找家务机器人转为实际搭建 XLeRobot。确定优先双轮舵机版，仿真发现“少装一层”仍够不到地面。","progress":["识别 XLeRobot 与 Mobile ALOHA 的区别，克隆仓库，初始基线为 b017b5e。中文旧资料、三全向轮仿真与 0.4 双轮硬件必须分别看待。","本机 MuJoCo 3.3.0 完成 120 步无窗口验证，并跑通交互渲染；这是原有三全向轮模型的结果。","建立 PROJECT_STATE.md 和 AGENTS.md 的设备台账规则。用户陈述已有 PICO Neo 3、Anker 165W/25000mAh；本机核验开发笔记本 RTX 4060 Laptop 8GB。","复核二手双臂套件、推车尺寸、相机与电源清单；约 2700 元是当日商品报价，不代表已付款。","派生仿真比较原高位、两层、中层下翻和低位前伸方案。低位前伸最接近地面目标；尚无真实支架装配与承载测试。","讨论手机作为终端、迷你主机作为车载网关、工作电脑承担训练/推理的架构，并查看国内 N100/N150 候选。"],"problems":["两层派生模型把双臂下移约 24cm，仍与地面玩具有明显距离；降低托盘不能直接等同于获得地面抓取能力。","充电宝的总功率标称不能证明两板同时供电稳定；12V 固定档和高功率降压线需要分开核对。"],"outcome":"已完成项目与现有设备盘点、软件仿真和改装方向筛选；没有实机动作、采购成交或低位结构实测结论。","next":["确认二手套件交付清单和供电规格。","先按原结构搭建，再决定是否制造低位支架。"],"lessons":["按硬件版本核对资料；仿真通过只说明对应模型和条件下可行。","已有资产、候选设备和已购设备应分别记账。"],"sources":["S01"],"commits":["b017b5e"],"evidence":["PROJECT_STATE.md","simulation/mujoco/","FABRICATION_ROADMAP.md"],"cutoff":"2026-11-03 14:46"},{"date":"2026-10-21","title":"核对套件，建立打印工坊路线和可复查的改件","status":"采购评估与设计","summary":"继续核对套餐与配件，生成低位前伸接口的参数化首件；打印机建议根据用户提供的实际价格从 P2S 转向 X2D。","progress":["围绕套餐一、套餐二、推车、电源、三路相机和底盘舵机交付内容核对卖家信息；卖家陈述与实物清点仍分开记录。","制作低位前伸接口的参数化 CAD、STL/STEP 等输出，保留上游结构，准备后续干装核对。","讨论办公室打印的噪声、气味、材料与通风条件，没有把过滤配置当作现场排放验收。","根据当日截图比较 X2D 多色套装 3994.15 元与 P2S 套装 3318.40 元，并归档价格口径；未据此认定已购买打印机。","配套维护对 C–F 盘做清点，随后按当时授权迁移旧模型与备份、清理缓存；这些是工作站维护记录。"],"problems":["卖家套餐描述中的底盘舵机数与本地双轮代码不同，必须留待实物核对。","打印支架的孔距、受力、走线、重心及办公室环境尚未进行物理试装或测量。"],"outcome":"有可复查的模型、工坊路线和历史比价材料；当日记录不能证明打印机已到货或支架已打印成功。","next":["到货时优先清点电源、控制板、舵机和损伤线缆。","打印前复核真实孔距和材料，再做干装。"],"lessons":["价格要比较同一 SKU、同一优惠口径。","文件可生成、可切片，与结构已合格是不同阶段。"],"sources":["S01","S05"],"commits":[],"evidence":["FABRICATION_ROADMAP.md","fabrication/cad/xlerobot_low_front_prototype.py","fabrication/purchasing/X2D_PRICE_HISTORY.md"],"cutoff":"2026-11-03 14:46"},{"date":"2026-10-22","title":"未找到当日记录","status":"记录空白","summary":"归档来源中未找到这一天的对话或台账条目；这不代表当天没有活动。","sources":[],"progress":[],"problems":[],"next":[],"lessons":[],"commits":[],"evidence":[],"empty":true},{"date":"2026-10-23","title":"套件到货，进入边装边排查的装配阶段","status":"到货与装配指导","summary":"根据用户提供的到货照片制定装配指南，把关键清点压缩到控制板、电源、轮组舵机和疑似受损线缆。","progress":["归档到货照片与首轮外观判断。主要机械件可见，遮挡处的数量和状态仍记为待核验。","整理官方双轮资料、通用双臂装配资料与视频，指出三全向轮教程不能直接套用于双轮底盘。","制定推车、轮组、上部底座、双臂与头部、电脑只读检测、分级动作测试的顺序。","保留二手设备已有编号与装配状态，先读取，不先恢复出厂或重新编号。"],"problems":["盒子数量不能当作电机数量，照片看不全不能直接认定齐套。","疑似露芯线缆和电源输出/极性需要实物确认后才可接电。"],"outcome":"装配指导与到货台账已落地；尚未形成全机通电、三路成像或机械行程验收。","next":["先装推车和轮组，检查机械干涉与线束余量。","连接电脑后逐板只读扫描，再考虑小范围动作。"],"lessons":["关键危险项认真清点，其余小配件可以随装配逐步确认。","版本和实物决定接线与配置，不能仅按套餐文案启动整机。"],"sources":["S01"],"commits":[],"evidence":["fabrication/assembly/ASSEMBLY_GUIDE_ZH.md","PROJECT_STATE.md"],"cutoff":"2026-11-03 14:46"},{"date":"2026-10-24","title":"未找到当日记录","status":"记录空白","summary":"归档来源中未找到这一天的对话或台账条目；这不代表当天没有活动。","sources":[],"progress":[],"problems":[],"next":[],"lessons":[],"commits":[],"evidence":[],"empty":true},{"date":"2026-10-25","title":"未找到当日记录","status":"记录空白","summary":"归档来源中未找到这一天的对话或台账条目；这不代表当天没有活动。","sources":[],"progress":[],"problems":[],"next":[],"lessons":[],"commits":[],"evidence":[],"empty":true},{"date":"2026-10-26","title":"未找到当日记录","status":"记录空白","summary":"归档来源中未找到这一天的对话或台账条目；这不代表当天没有活动。","sources":[],"progress":[],"problems":[],"next":[],"lessons":[],"commits":[],"evidence":[],"empty":true},{"date":"2026-10-27","title":"双板从单侧异常恢复，搭起只读调试台","status":"接线与只读检测","summary":"先定位 USB、供电和串口占用问题，随后读到两块板共 16 个电机，开始把设备状态和动作许可做成可视面板。","progress":["早期 COM3 可读、COM4 打不开；COM3 反馈电压从约 5V 变为正常 12V，表明动力供电与 USB 枚举需要分开检查。","识别另一程序占用串口的情况，保持已有程序与现场状态，避免同时争抢总线。","双板恢复后，COM3 的 ID 1–8、COM4 的 ID 1–6/9/10 均有应答，共 16 个电机。","创建本地只读调试台，展示舵机遥测、相机、手柄输入，以及观测/校准/受限控制许可。","用户断开设备后准备受限控制软件：当前位置保持、按键单步、停止和断连处理，并补齐实时状态反馈。"],"problems":["串口存在不等于能打开，USB 供电存在不等于舵机动力供电正常。","网页能看到手柄输入，仍不能证明电机已收到可执行命令。"],"outcome":"两板与电机拓扑已得到只读确认，受限控制软件就绪；没有据此认定完整手柄实机控制已通过。","next":["确认物理左右臂、关节与编号对应。","保持单一串口所有者，先做当前位置保持和小步验证。"],"lessons":["把设备在线、动作许可、输入、下发与实际反馈分开显示。","逐层排查 USB、动力供电、串口占用和总线应答。"],"sources":["S01","S02"],"commits":[],"evidence":["fabrication/assembly/debug_console/","PROJECT_STATE.md"],"cutoff":"2026-11-03 14:46"},{"date":"2026-10-28","title":"修通手柄到编码器的链路，并接入原版整机映射","status":"控制链路实测","summary":"在多次“页面看似正常但设备不动”之后，找到校准格式、步长、串口争用与后台输入问题，以实际编码器变化完成局部验收。","progress":["按用户授权打开 16 个电机的当前位置保持扭矩，并回读零速与位置变化；与主动移动分开记录。","补齐初始校准与运行服务读取逻辑，排除旧服务仍在响应、浏览器手柄状态判断不一致的问题。","统一串口管理并改用 Windows XInput。虚拟 Xbox 经过真实控制服务驱动肩部编码器 1998→2008→1995，左腕也有小幅往返反馈。","升级完整手柄映射、输入/目标/反馈日志、限位提示与暂停恢复体验，保留用户接管。","按照用户选择落地上游 Xbox 控制语义；原版软件预览可用，但完整实机仍缺真实行程和运动学参考。","切换 origin 为个人维护仓库并保留 upstream。另在 open-share 验证百度网盘 CLI 路径和带回读校验的通用备份流程。"],"problems":["早期把“目标写入但未动”过早归因于舵机本体，后续发现仍有控制链路问题；保留这个误判。","当天存在未经当次审批的扭矩试验后复位记录；后续明确区分保持、动作和接管授权，不能用历史授权替代当前边界。","初始保持窗口不等于完整机械行程；预览模式和已跑通局部关节不等于整机可用。"],"outcome":"局部手柄控制得到实机反馈验证，原版整机映射完成软件首版；底盘与末端联动仍待分项验收。","next":["采集真实关节范围，补运动学参考。","迁移到车载电脑前保留参数与证据，继续用分项验收约束结论。"],"lessons":["验收完整链路要看到实际编码器变化和停止行为。","校准就绪、扭矩打开、接管开启、设备运动是四种不同状态。","明确复核动作授权，并保存误判和纠正过程。"],"sources":["S01","S02","S04"],"commits":["206d1af","77858","ef76b26"],"evidence":["PROJECT_STATE.md","fabrication/assembly/debug_console/"],"cutoff":"2026-11-03 14:46"},{"date":"2026-10-29","title":"Studio 与车载 Windows 部署落地，整机控制继续补课","status":"车载部署与实测","summary":"8770 Studio 成为统一入口；车载笔记本完成真实 SSH、局域网访问与设备监控。能部署、能读电机之后，仍花了多轮排查把控制准备和行程采集做实。","progress":["Studio 首版整合 9 个工作区、20 项能力、14 篇手册，明确可用工具、待适配能力和社区参考。","按用户新的方案改用车载 Windows 笔记本，取代早期手机加小主机建议；准备离线环境与迁移资料。","核对 SSH 主机指纹后真实连接。先做隔离预览，再验收笔记本 8770 的局域网直连、防火墙及同源接口。","车载监控读取 COM8/COM9 共 16 个电机、三路相机和 Xbox；用 USB 身份而非固定 COM 号绑定控制板。","逐电机测试先为 9/16 通过，进一步修复后为 12/16；整机尚不能因此宣布完成。","发现同固件舵机写位置目标可能自动使能扭矩，修复保持、回中和停止路径，保留卸力关节。","构建真实行程与姿态卡采集，增加左右臂对调、物理车轮定义、自由顺序保存、故障隔离和中断恢复。","用户关机后完成预设直控与交互复查；发现第一版仍被旧 ±32 计数窗口限制，再次修正。制作 10 月 29 日的旧版证据快照，并按要求让笔记本休眠。"],"problems":["建立接管会话却未准备实机扭矩、到位后误报“未移动”、旧标定过窄，都会导致用户看见输入而设备不动。","左右逻辑对调后参考姿态必须仍绑定物理手臂，不能只交换界面文字。","晚间对预设直控的修复在断开设备后完成，当时没有实机复验。"],"outcome":"车载运行、网络和设备监控已实测；低速局部控制可用。完整整机末端联动、精确参考及晚间改动仍有待验收项。","next":["设备恢复后部署昨晚修复，写入真实行程。","逐步补全整机运动学参考，避免把调节向导做成无法试用的前置障碍。"],"lessons":["源码同步、运行版发布、设备监控和动作验收必须分别记录。","要检查真实监听进程、HTTP 内容与设备反馈，不能只信端口开放或部署成功。","中断和跨日期恢复不能丢失已经采集的姿态与行程。"],"sources":["S01","S03","S06"],"commits":["0974d37","14c8fda","f04c274","496cfc9","b4439a8","7c659e3","c44bac2"],"evidence":["PROJECT_HANDOFF_ZH.md","deployment/windows/README_ZH.md","PROJECT_STATE.md"],"cutoff":"2026-11-03 14:46"},{"date":"2026-10-30","title":"写入行程、修复自检，验证无需登录的开机恢复","status":"限位与部署实测","summary":"前一晚的 14 项行程得到恢复和写入；自检中的退离失败促成竖直姿态方案。Windows 更新重启暴露服务启动问题，随后完成真实无人登录启动验证。","progress":["恢复工作端热点后部署车载版本，修复只搜索当天证据目录的问题，找回前一天 14 项行程并逐颗回读写入。","根据用户反馈修正底盘前后和头部左右方向，改进电压抖动、触限、关节受阻和手柄短断连处理。","完成限位自检界面和分项回执；下午用户运行的一轮为 14 项中 10 项完成、4 项失败，保留失败项原范围。","Windows 更新触发重启导致 8770 不可访问；核查网络与 SSH 正常、服务未启动，再调整更新策略和热点自动关闭设置。","将服务改为开机任务，真实重启到未登录状态后，网页、双板和电机监控恢复；未把这次结果扩大成所有手柄重连都已验证。","新增手动卸力/当前位置锁定。Elite 背键通过 Xbox 配件映射为摇杆按下；不假定 XInput 会直接提供背键。","用竖直起点重跑 4 项失败自检，减少重力与碰车体风险；退离止挡必须看到真实位置变化。","制定助手控制规范与第一轮自主运行设计，设备断开后按要求让笔记本休眠。"],"problems":["顶止挡后退不出来，可能涉及舵机过载降输出、姿态干涉或判据宽松，不能全部当成硬件损坏。","“登录后自启”并不能覆盖更新重启停在登录界面的情形。","手动摆位的部分边界仅通过模拟总线验证，不能统称实机全测。"],"outcome":"行程、自检恢复和开机服务得到多项实机验证，竖直自检方法可复用；自主运行当晚仍处于准备状态。","next":["重新上电后先只读预检，按规范开始第一轮自主观察。","独立验证相机对应、退离判据和全部停止条件。"],"lessons":["碰阻与机械限位要区分，退离成功必须回读确认。","后台启动能力要用真正的重启、未登录、设备读取来验收。"],"sources":["S06"],"commits":["95386c2","b8f23e1","57a374a","9a9ef0c","ebc190e","397d912"],"evidence":["fabrication/assembly/debug_console/AGENT_CONTROL_ZH.md","fabrication/assembly/debug_console/AGENT_ROUND1_ZH.md","PROJECT_STATE.md"],"cutoff":"2026-11-03 14:46"},{"date":"2026-10-31","title":"未找到当日记录","status":"记录空白","summary":"归档来源中未找到这一天的对话或台账条目；这不代表当天没有活动。","sources":[],"progress":[],"problems":[],"next":[],"lessons":[],"commits":[],"evidence":[],"empty":true},{"date":"2026-11-01","title":"未找到当日记录","status":"记录空白","summary":"归档来源中未找到这一天的对话或台账条目；这不代表当天没有活动。","sources":[],"progress":[],"problems":[],"next":[],"lessons":[],"commits":[],"evidence":[],"empty":true},{"date":"2026-11-02","title":"自主观察、MOSS、整机参考与有限移动并行推进","status":"多模块实测与交付","summary":"第一轮自主观察完成，交叉视角与待审经验制度建立。Studio 增加空间观察、机器人展示、语音和自主学习；短移与建图保留明显限制。","progress":["第一轮自主运行确认头部/左右腕相机对应，补测行程，修正退离与受阻判据。用另一条收起手臂的腕相机从侧面观察前伸手臂，补足笔记本视角。","建立已审核规范、观察手册、待审核经验三层资料；待审核经验默认参与判断，但不能放宽硬性边界。观察手内转造成碰撞的失败也归档。","车载小九桥接、持久会话、去重和超时/取消/崩溃处理落地；完整源码同步与运行发布分开核对。","空间观察从 31 张图/17 项标记发展到 68 张/23 项，最终为 101 张/26 项。先前独立观察服务退役，能力并入 8770。","MOSS 展示接入署名模型、固定吊顶与独立关节，修复局域网消息发送，加入人设、MiniMax 语音和十套待机动作。早期浏览器失败与后续实际页面复验均保留。","语音输入默认关闭，名字唤醒、持久对话和静默交付完成；真实麦克风与有声效果按用户要求留待现场测试。","通过受限自检补齐双臂运动学参考和夹爪端点，验证可启动待机姿态与低速联动；精确定位仍未完成测量标定。","朝过道完成 5 次低速短移，因人和椅子停止，未到开阔过道。后续两次以 5cm 为目标的尝试提前保护停车，编码器估算累计约 3.1cm，未到红线。","增加自主学习、双目标定工具与算力路由；远端只提供加速建议，本地控制器保留最终动作与停车权。"],"problems":["轮 10 动作中曾报告 57°C、停车后 35°C，原因没有查清，自主移动暂停。","手柄操作和轮位变化后地图定位失效；照片方位图、红线和编码器估算都不足以构成可靠地面围栏。","首次展示与关节测试存在失败；不能引用早期未通过的阶段，也不能用后续修复抹去当时失败。","语音链路有 CLI 收尾延迟；静默逻辑通过不代表实际语音体验已验收。"],"outcome":"自主观察、多个 Studio 模块与整机初始化有实测交付；自主导航、可靠围栏、精确定位、通用双目抓取仍未完成。实时避障的部署结果跨到次日记录。","next":["先完成地面/相机标定与避障实物测试，再扩大自主移动。","以实际物品抓取建立可复核经验，区分单目规则和双目测距。"],"lessons":["每段移动都重新观察，遇到本地手柄输入立即让出控制并使旧定位失效。","3D 展示要验独立关节和真实消息往返，结构测试不能代替页面交互。","实时安全判断留在车上，模型和工作站故障不能取消停车保护。"],"sources":["S06","S07","S08","S09","S10","S11"],"commits":["24cf22b","e8426c4","464b97a","aad2b44","6a41a8e","4ecddf1","61ce61a"],"evidence":["fabrication/assembly/debug_console/AGENT_OBSERVATION_ZH.md","fabrication/assembly/debug_console/AGENT_LEARNING_ZH.md","docs/presence/","docs/autonomy/"],"cutoff":"2026-11-03 14:46"},{"date":"2026-11-03","title":"从人工分步抓放到本地识别接班，纠正底盘方向","status":"实物抓放与受限移动","summary":"上午先失败再抓起放回；下午演练暴露进入路径碰倒物体，修复后完成大模型辅助与工作站本地模型各一次快速抓放。底盘方向通过相机重新核实。","progress":["凌晨完成头部单目避障的软件部署和照片评估。部署时硬件不在、没有实时相机和行驶；缺画面、缺标定、数据过期均阻断前进。","09:42–10:33 第一次抓取共 28 次运行、153 张照片。左臂伸到极限仍差约 1–2cm（照片/模型推断），闭合只推走插头；未拿起、未放下。","用户将物品移近后，10:54–12:18 再运行 45 次。约 55° 斜夹多次滑脱，随后改为约 15° 下倾、指尖距桌约 1.4cm、水平推进，夹紧并在同次运行内抬肩。","第二轮实际拿起并保持约 10 秒，再放回、松开、撤离。抬高约 1.5–3cm 为图像估计，不是尺量；底盘全程未主动运动。","以左腕相对物体/背景变化、头部的桌面参照、右腕侧视和影子分离交叉确认提起。两轮合计 73 次运行、474 张照片，肩部最高温度约 41°C。","完成快速抓取设计与代码：8770 做实时跟踪和状态机，8765 做有界伺服会话，避免分次动作清除夹紧力；本机 357 项回归、9 项页面测试通过。","配套维护完成历史 QA 副本迁移，随后按另一条对话中的明确授权删除已迁移的历史副本；日志保留先迁移、再删除的顺序。","14:44以后完成新流程实机预检。仿真未覆盖单步900计数上限，实机第一步被拒绝，修复分段后到观察位；目标太近、腕下盲区导致首次未抓。","15:23演练11步、34.6秒成功送入两指而不闭合；重回观察位时碰倒插头。随后提高观察位并改从后上方进入，保留触碰与路径修正证据。","根据当时新授权设计抓取搬运v2与净后退额度。前三段所谓“后退”实际朝桌子靠近，轮估累计约10.5cm；用头部和右腕画面判定方向错误，修复后先以2cm短段复核。","17:21大模型框选侧躺插头，59.8秒/25步完成抓起、横移放回；18:10工作站CPU上的OWL-ViT三帧识别用时3.4秒，随后59.9秒/24步完成另一轮，全程无需大模型识别。","经典模板在空白桌面也给出高分而被拒绝自动接班。OWL-ViT替代的是目标框选，动作耗时仍主要由机械执行决定，模型运行在工作站而不是车载小电脑。","两腕分别朝左右后方观察，仍有正后方和近轮地面盲区；按当时授权净20cm范围完成后退与四段前进返起点，距离为轮估。最后按用户要求休眠。"],"problems":["第一轮物品在可达范围外，不能靠继续闭合补救；第二轮斜夹和夹紧力跨运行被清除都会导致滑脱。","成功抓取抬得低、夹持负载小，不能证明更重物品或大于 5cm 的提升可靠。","快速抓取离线测试通过，与车载 OpenCV 环境回归、演练和重复实物抓放是不同验收项。","单目地面外观法对浅色障碍仍有漏检风险；地面单应尚未标定。","观察位下落碰倒轻物却未触发contact，说明“未报告受阻”不能证明路径未接触物体。","10月30日手柄方向记录与本日方向核验矛盾，原因未查清；不能把旧映射名称当作当前车头方向证据。","轮温有多次瞬时异常，立即复读恢复；保留毛刺与保护记录，硬件原因尚未解决。"],"outcome":"上午一次分步抓放、下午大模型辅助与工作站本地识别各一次抓放均有物理证据；受限移动完成方向复核与往返。没有完成长期成功率、尺量精度或自主避障验收。","next":["固定物体姿态和夹爪条件，分别验证自动识别、完整抓放与重复成功率。","准备量具或标记物完成地面/双目/里程标定；未通过浅色障碍测试前保留避障阻断。"],"lessons":["先检查可达余量，再夹；在离目标远的位置张开，低位近水平送入。","夹紧、提起、验证和放回应在同一个保持夹持力的执行过程里完成。","相似度单一高分不能单独证明提起，要同时看实际运动与多个相机参照。","新控制方法的仿真要复刻执行器全部约束，端点可达也要检查整条进入路径。","底盘方向应由新鲜多视角变化确认；本地识别接班不等于整个机器人脱离工作站。"],"sources":["S07","S11","S12"],"commits":["715bacb","cc9f768","8b9a129","464ffb9","5c3055a","00f25d1","fff5ca4","7388f47"],"evidence":["PROJECT_STATE.md","docs/autonomy/FAST_GRASP_ZH.md","fabrication/assembly/debug_console/AGENT_LEARNING_ZH.md","docs/autonomy/MANIPULATION_V2_ZH.md","docs/autonomy/MOBILE_OBSERVATION_ZH.md"],"cutoff":"2026-11-05 10:12"},{"date":"2026-11-04","title":"抓放出现连续成功，固定批次却暴露可靠性不足","status":"现场综合测试与可靠性复测","cutoff":"2026-11-05 10:12","summary":"从旧帧恢复、交叉观察和持续夹持中获得多次成功，也通过固定批次保留失败，确认80%目标尚未达到；同色桌面成为明确的避障漏检反例。","progress":["现场无棋盘格和卷尺，继续不依赖度量真值的测试。休眠恢复后相机重复发送旧JPEG，序号与接收时间仍增长；仅恢复所属采集子进程后看到真实新画面，并增加重复内容过期保护。","上午完成四段后退2+5cm、前进5+2cm，轮估回到起点。完成关节读数/拟合候选和共享帧时差采样，均与外部位姿精度、硬件曝光同步分开记录。","第一组为4次自动运行与1次手动试验：仅首次有明确抓起放下证据，其余失败或未确认；运行内重试数与物理尝试数单独保留。","11:21–11:39加入固定右腕侧视，5次工程尝试前2次失败、后3次完成抓放；一次放下后朝向发生变化。提高包覆和受限加压有局部效果。","按用户要求建立物品档案与夹持评估规范，记录材质、表面、估计重量的来源与置信度；只提供候选强度，未建立接触力标定或开放自动调力。","14:56–15:20尝试协调提起、同会话保压和分档释放：6次中3成功、1失败、2未确认，最后3次成功。按实读补偿腕角只作为本场候选方法。","随后预登记白色固定批次A共10次，前4次2成功、2失败，衬条再次疑似松脱后中断；后6次未执行。衬垫修复后平放8次、重摆直立4次均无完整成功，各组分别归档。","用户再次确认衬垫固定，并新增黑色充电头。右臂5次不同策略工程试夹仅1次完成离桌、保持3秒、放回；另一个固定批次前2次低压停止、0/2后中断，余8次未做。","感知吞吐与源龄链路有数据，但白桌ROI约99.98%误判为地面，O2未通过；静止相机中断/过期、工作端离线拒绝动作得到验证，持续自主避障行驶保持不开放。","每组保留独立回执包、源图和失败。当日结束时记录两臂停靠、轮组零速，之后按用户指令休眠；这只是当时状态。"],"problems":["衬条多次松脱与处理使接触条件变化；固定或取下的具体方式、材料与摩擦系数未确认，不能把历史压力终点当当前稳定参数。","两指常推着物体转向，未形成稳定对向包覆；更小闭合目标、更高扭矩上限和插入深度均未单独恢复可靠性。","控制步骤完成、夹持初始负载高或图像相似度高，仍可能没有完全离桌或在试提中失持。观察缺帧与遮挡按未确认保留。","相机重复旧内容、偶发停止更新和轮温跳变的完整硬件/驱动根因仍未闭环；静止故障注入不能替代运动中整控制进程崩溃停车。","与官方演示比较时发现，部分家务任务由人工遥操作完成；本机自动定位、接触控制与任务示范学习条件不同，不能直接横比完成度。"],"outcome":"获得多组可复查的抓放正负例，并落实夹持档案与观察方法。白色固定A仅2/4后中断，修复后的0/8、0/4与黑色固定0/2分别保留；没有达到或证明80%目标，也没有完成自主避障。","next":["先稳定衬垫、对向包覆、观察位和单个动作变量，再冻结独立批次，所有已启动尝试进入分母。","为夹持读数门增加独立成功对照和误拒统计；继续用侧视验证离桌、保持、受控放下。","处理白色障碍漏检并补齐度量标定，保持本地候选不自动晋级为动作策略。"],"lessons":["连续成功只说明当时局部有效，固定批次才检验重复性；失败和未确认不能删。","衬垫、目标朝向或方法改变就另起组，不拼接成功凑比例。","同一有时限执行会话内保持夹持，结束会话的保护性清理会改变原加压目标。","分类、材质和估计重量能辅助选择候选，扭矩百分比与舵机负载都不是牛顿接触力。","链路速度通过不能抵消障碍漏检；旧JPEG内容不应凭新序号获得续期。"],"sources":["S07"],"commits":["e4e25a0","5540b37","564885a","eed0f24","95b7fc1","705de35"],"evidence":["docs/autonomy/TEST_SESSION_20261104_ZH.md","docs/autonomy/CROSS_ARM_GRASP_20261104_ZH.md","docs/autonomy/GRASP_FORCE_POLICY_ZH.md","docs/autonomy/NEW_GRASP_TECHNIQUES_20261104_ZH.md","docs/autonomy/GRASP_RELIABILITY_20261104_ZH.md","docs/autonomy/BLACK_CHARGER_GRASP_20261104_ZH.md"]},{"date":"2026-11-05","title":"本地关节补偿有局部效果，抓取模型仍在候选阶段","status":"上午已完成一轮；午前训练进行中","cutoff":"2026-11-05 10:12","summary":"按新授权开展受限后退、转向和本地学习。头部补偿在笔记本独立执行；轮速和抓取提示验证不足。10:06开始的新训练截至本快照尚未收尾。","progress":["用户授权以当前起点净后退最多50cm并做有限转身。新额度独立记账，不清空旧记录；每段短移、停车后重新观察。","上午第一轮8次后退指令，首次5cm请求超时后停车，后7段完成；额度保守占34/50cm，七段轮估28.59cm，首次实际距离未知。六次小角转向后原航向没有外部复核，随后未平移。","三场采集72个关节样本，48训练、24留出，头水平与当时右肩水平的局部补偿候选最大残差2.17计数，未默认采用。笔记本独立读模型并执行12次头部补偿，最大实读误差2计数、平均绝对0.5计数。","轮速4次训练、3次整段留出；留出R²为0.893，低于0.98门槛，不采用，也不称地面距离或转角标定。","抓取结果提示用19个历史白色物理尝试训练、7个黑色整组留出，6/7一致，却漏判唯一成功；与全部预测失败的基线相同，保持candidate/shadow_only且无动作权限。","纯Python本地读模型和推断中位1.08ms、HTTP端到端17.11ms；已有经典跟踪在腕部小转动下88次状态有效，中位11.4ms。这不是新神经网络、自动类别识别或深度测距。","09:30第一轮收尾为两臂收起、双轮零目标零速、无活动会话；底盘留在后退位置，没有声称回到起点。64项车载聚焦回归通过，643份回执文件独立下载校验。","10:06用户追加午前抓取和移动训练，目标80%。截至10:12，只看到前两段前进正常、第三段因温度读数多次跳变停车；即时复读恢复34°C，正在静止采样排查。尚无此轮抓放结果或最终停靠。","本次继续归档拉取同样12条会话，较前批新增237条用户/助手消息，其中21条用户消息。11月3日补下午，11月4日新增全日复盘，11月5日明确标为截至时点。"],"problems":["计数短移和一维授权台账不提供真实地面位置、原航向或无障碍保证；超时段必须保守占额度。","85.7%的标签一致率看似高，但没有识别出留出成功，不能当抓取成功率或有用的成功预测。","局部头关节编码器误差改善不等于末端毫米精度，不适用于任意姿态、负载、速度或全部关节。","本日午前训练尚在执行；成功率目标、后续抓放与停车状态均不能提前写成结果。"],"outcome":"确认笔记本独立运行的局部头部补偿与既有视觉跟踪有时效数据；抓放提示和轮速模型仍未通过晋级，未获得新的抓放成功率。午前第二轮仅归档截至10:12已发生的过程。","next":["后续归档时补齐午前第二轮的失败、成功、实际授权额度和收尾，不覆盖本次快照。","模型继续按物理尝试/场次留出，与简单基线比较，补足成功召回、误报和未知样本。","固定抓取接触条件后再开展新的预登记批次；外部距离与转角真值仍待量具或标记。"],"lessons":["模型有多快和模型有没有用是两种验证；基线、成功召回与独立样本都必须报告。","已训练、已验证、已采用、已执行应分别记录，本地候选不因推断快而取得动作权。","归档活跃任务要明确截止时间，过程记录不能冒充整轮完成。"],"sources":["S07","S12"],"commits":["a687d0f"],"evidence":["docs/autonomy/AUTONOMOUS_LEARNING_20261105_ZH.md","docs/autonomy/LEARNING_PROTOCOLS_ZH.md","PROJECT_STATE.md"]}],"display":{"calendar_days":17,"recorded_days":11,"blank_days":6,"lessons":19}}</script>

const el=(tag,text,cls)=>{const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node};
function chapter(title,items){const section=el('section',undefined,'chapter');section.append(el('h3',title));if(Array.isArray(items)){const list=el('ul');items.forEach(item=>list.append(el('li',item)));section.append(list)}else section.append(el('p',items));reading.append(section);return section}
function sourceTags(ids){const group=el('div',undefined,'sources');ids.forEach(id=>{const b=el('button',id,'source-tag');b.type='button';b.setAttribute('aria-label',id+' '+sourcesById[id].title);b.onclick=()=>{setMode('sources');document.getElementById('source-'+id)?.scrollIntoView({block:'center',behavior:'smooth'})};group.append(b)});return group}
function drawIndex(){const query=document.getElementById('search').value.trim().toLowerCase();const days=journal.calendar.filter(day=>(!recordedOnly||!day.empty)&&JSON.stringify(day).toLowerCase().includes(query));const nav=document.getElementById('dates');nav.replaceChildren();days.slice().reverse().forEach(day=>{const button=el('button',undefined,'day-button'+(day.empty?' empty':''));button.type='button';button.dataset.date=day.date;if(day.date===selected&&mode==='days')button.setAttribute('aria-current','date');button.append(el('span',day.date,'date'),el('span',day.empty?'未找到当日记录':day.title,'name'));button.onclick=()=>{selected=day.date;setMode('days')};nav.append(button)});document.getElementById('result-count').textContent=days.length+' 个日期'+(query?'匹配检索':'');if(!days.length)nav.append(el('p','没有匹配的日期；可以修改关键词。','empty-note'))}
function renderDay(){const day=journal.calendar.find(d=>d.date===selected);reading.append(el('div',day.date+' / '+day.status,'eyebrow'),el('h2',day.title),el('p',day.summary,'lead'));if(day.empty){chapter('记录空白','此日期没有找到可归档的对话或台账条目。找到原始材料后再追加，保留当前空白。')}else{chapter('当天推进',day.progress);chapter('问题与失败',day.problems);const result=el('section',undefined,'outcome');result.append(el('h3','当日结果与边界'),el('p',day.outcome));reading.append(result);chapter('接下来',day.next);chapter('可复用经验',day.lessons);const refs=chapter('回查来源','');refs.append(sourceTags(day.sources));if(day.commits.length){const p=el('p','关键历史提交：'+day.commits.join(' · '));refs.append(p)}refs.append(el('p',day.evidence.join(' / '),'source-row'))}reading.append(el('p','本日整理依据截止 '+(day.cutoff||journal.cutoff)+'（北京时间）。这是历史记录，后续事项不构成新的动作授权。','tail'));const navigation=el('nav',undefined,'prev-next');navigation.setAttribute('aria-label','相邻日期');const i=journal.calendar.findIndex(d=>d.date===selected);for(const [label,delta]of[['← 前一天',-1],['后一天 →',1]]){const b=el('button',label);b.type='button';b.disabled=!journal.calendar[i+delta];b.onclick=()=>{selected=journal.calendar[i+delta].date;setMode('days')};navigation.append(b)}reading.append(navigation)}
function renderLessons(){reading.append(el('div','EXPERIENCE / '+journal.lessons.length+' NOTES','eyebrow'),el('h2','把成功和失败都留下来'),el('p','每条经验都保留问题、后来采用的做法和适用边界。这里的一次成功，不会被写成通用能力。','lead'));journal.lessons.forEach((note,i)=>{const s=el('section',undefined,'chapter');s.append(el('div',String(i+1).padStart(2,'0')+' / '+note.dates.join(' · '),'lesson-label'),el('h3',note.title),el('p',note.problem),el('p',note.method),el('p','适用边界：'+note.limit),sourceTags(note.sources));reading.append(s)});chapter('可以展开的分享线索',journal.story_outline)}
function renderSources(){
const stats=journal.snapshot;
reading.append(el('div','SOURCES / '+journal.cutoff,'eyebrow'),el('h2','每一个结论，都可以回到来源'),el('p','当前工作区的 '+stats.project_threads+' 条对话全部纳入，另收录 open-share 中相关的 '+stats.related_threads+' 条。原始记录与现场图片保留在私人备份，这里呈现整理后的内容。','lead'));
const metrics=el('p',undefined,'metrics');
for(const [value,label] of [[stats.threads,' 条会话 / '],[stats.user_messages,' 条用户消息 / '],[journal.display.calendar_days,' 个连续日期']])metrics.append(el('b',String(value)),document.createTextNode(label));
reading.append(metrics);
chapter('本次新增', ['比前批新增 '+stats.delta_user_messages+' 条用户消息、'+stats.delta_messages+' 条用户/助手消息，涉及 '+stats.changed_threads+' 条会话。','补齐11月3日下午、新增11月4日与11月5日上午。午前训练只记录截止前已经发生的过程。']);
chapter('图片与原始证据',[stats.attachment_references+' 个用户图片引用：'+stats.copied_attachments+' 个原文件、'+stats.recovered_inline_attachments+' 个会话内嵌版本。内嵌版本不能声称与原文件字节相同。','本批另存 '+stats.support_files.toLocaleString()+' 个已有证据文件，其中 '+stats.support_images.toLocaleString()+' 个图片文件；晚于截止或不稳定读取的 '+stats.support_skipped+' 个文件留待下一批。']);
chapter('当前结果与边界',journal.current_boundaries);
chapter('范围与缺口',journal.coverage_notes);
const batches=chapter('归档批次','旧原始快照与备份保持原样，公开日志累计更新。');
for(const batch of journal.batches){batches.append(el('h3',batch.cutoff+' / '+batch.user_messages+' 条用户消息'),el('p',batch.calendar_days+' 个日期，'+batch.recorded_days+' 天有记录。'));if(batch.sha256)batches.append(el('p','完整包 SHA-256：'+batch.sha256,'source-row'));}
journal.sources.forEach(source=>{const section=el('section',undefined,'chapter source-row');section.id='source-'+source.id;section.append(el('div',source.id+' / '+source.workspace,'lesson-label'),el('h3',source.title),el('code',source.thread),el('p',source.reason));if(source.parent)section.append(el('p','分叉来源 '+source.parent+'；继承前缀 '+source.inherited_records+' 条记录，日报不重复计入。'));reading.append(section)});
}
function setMode(value){mode=value;reading.replaceChildren();for(const [id,name]of[['tab-days','days'],['tab-lessons','lessons'],['tab-sources','sources']])document.getElementById(id).setAttribute('aria-pressed',String(value===name));if(mode==='days')renderDay();else if(mode==='lessons')renderLessons();else renderSources();drawIndex();const hash=mode==='days'?selected:mode;if(location.hash.slice(1)!==hash)history.replaceState(null,'','#'+hash)}
document.getElementById('tab-days').onclick=()=>setMode('days');document.getElementById('tab-lessons').onclick=()=>setMode('lessons');document.getElementById('tab-sources').onclick=()=>setMode('sources');document.getElementById('filter-all').onclick=()=>{recordedOnly=false;document.getElementById('filter-all').setAttribute('aria-pressed','true');document.getElementById('filter-recorded').setAttribute('aria-pressed','false');drawIndex()};document.getElementById('filter-recorded').onclick=()=>{recordedOnly=true;document.getElementById('filter-all').setAttribute('aria-pressed','false');document.getElementById('filter-recorded').setAttribute('aria-pressed','true');drawIndex()};document.getElementById('search').addEventListener('input',drawIndex);document.getElementById('print').onclick=()=>window.print();const hash=location.hash.slice(1);if(journal.calendar.some(d=>d.date===hash))selected=hash;setMode(['lessons','sources'].includes(hash)?hash:'days');
</script>
</body>
</html>
