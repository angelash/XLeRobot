<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>XLeRobot · 制作日志</title>
<style>
:root{--paper:#f5f3ed;--ink:#242a2b;--muted:#666d6d;--rule:#d1d3cb;--accent:#a84923;--soft:#e8eae2;--serif:"Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif;--sans:"Microsoft YaHei","PingFang SC",sans-serif;--mono:"Cascadia Code","Consolas",monospace}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.9}button,input{font:inherit}button{color:inherit;cursor:pointer}a{color:var(--accent);text-underline-offset:4px}a:hover{color:var(--ink)}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.shell{max-width:1360px;margin:auto;padding:34px 48px 60px}.masthead{border-top:4px solid var(--ink);border-bottom:1px solid var(--ink);padding:25px 0 24px;display:flex;justify-content:space-between;align-items:end;gap:26px}.kicker{font:12px var(--mono);letter-spacing:.14em;color:var(--muted)}h1{font:38px/1.4 var(--serif);margin:7px 0 4px;letter-spacing:.04em}.masthead p{margin:0;color:var(--muted);font-size:13px}.issue{font:12px/1.9 var(--mono);text-align:right;white-space:nowrap}.issue strong{color:var(--accent);font-weight:500}.toolbar{display:flex;gap:24px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--rule);padding:15px 0}.tabs{display:flex;gap:23px;flex-wrap:wrap}.tab{border:0;background:none;padding:5px 0;color:var(--muted);font-size:14px}.tab[aria-pressed=true]{color:var(--accent);box-shadow:inset 0 -1px var(--accent)}.quiet{border:1px solid var(--rule);background:none;padding:5px 12px;font-size:12px}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:54px;padding-top:27px}.rail{min-width:0}.search-label{font-size:12px;color:var(--muted);display:block}#search{display:block;border:0;border-bottom:1px solid var(--ink);background:none;width:100%;padding:9px 0;border-radius:0;color:var(--ink);font-size:14px}.filter{display:flex;gap:16px;margin:12px 0 18px}.filter button{font-size:12px;padding:3px 0;border:0;background:none;color:var(--muted)}.filter button[aria-pressed=true]{color:var(--accent)}.date-list{display:flex;flex-direction:column;gap:0}.day-button{display:grid;grid-template-columns:88px 1fr;text-align:left;width:100%;border:0;border-bottom:1px solid var(--rule);padding:11px 0;background:none;gap:11px;line-height:1.7}.day-button .date{font:12px/1.9 var(--mono);white-space:nowrap}.day-button .name{font-size:12px;overflow-wrap:anywhere}.day-button[aria-current=date]{color:var(--accent)}.day-button.empty{color:#7a807b}.rail-note{font-size:11px;color:var(--muted);line-height:1.8;margin-top:22px}.reading{min-width:0;max-width:860px}.reading .eyebrow{font:12px var(--mono);color:var(--accent);letter-spacing:.08em}.reading h2{font:30px/1.6 var(--serif);margin:8px 0 16px;overflow-wrap:anywhere}.lead{font-size:17px;line-height:1.9;margin:0 0 27px;max-width:760px}.chapter{border-top:1px solid var(--rule);padding:21px 0 14px}.chapter h3{font:19px/1.6 var(--serif);margin:0 0 13px}.chapter p{margin:0 0 12px;font-size:14px}.chapter ul{padding-left:20px;margin:0}.chapter li{padding-left:5px;margin:0 0 13px;font-size:14px;overflow-wrap:anywhere}.outcome{border-left:3px solid var(--accent);padding:0 0 0 20px;margin:22px 0 30px}.outcome h3{font:18px var(--serif);margin:0 0 12px}.outcome p{font-size:15px;margin:0}.sources{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0;font:12px var(--mono)}.source-tag{border-bottom:1px solid var(--rule);padding:2px 0;background:none;border-top:0;border-left:0;border-right:0}.tail{font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:18px;line-height:1.9}.foot{border-top:1px solid var(--ink);margin-top:38px;padding-top:17px;display:flex;gap:20px;justify-content:space-between;font-size:11px;color:var(--muted)}.metrics{font:13px/2 var(--mono);margin:18px 0 25px}.metrics b{font-weight:500;color:var(--accent)}.lesson-label{font:12px var(--mono);color:var(--accent);margin-bottom:7px}.source-row{overflow-wrap:anywhere}.source-row code{font:11px/1.9 var(--mono)}#result-count{font-size:11px;color:var(--muted);margin:12px 0 3px}.empty-note{font-size:14px;padding:22px 0;border-top:1px solid var(--rule)}.skip{position:absolute;left:-9999px}.skip:focus{left:20px;top:10px;background:var(--paper);padding:8px}.prev-next{display:flex;justify-content:space-between;gap:16px;margin-top:26px}.prev-next button{border:0;background:none;font-size:12px;color:var(--accent);padding:7px 0}.prev-next button:disabled{color:var(--muted);cursor:default}
@media(max-width:900px){.shell{padding:24px}.layout{grid-template-columns:205px minmax(0,1fr);gap:27px}.reading h2{font-size:26px}h1{font-size:32px}}
@media(max-width:620px){.shell{padding:17px}.masthead{display:block;padding:18px 0}.issue{text-align:left;margin-top:13px;white-space:normal}.layout{display:block;padding-top:17px}.rail{margin-bottom:26px}.date-list{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;max-height:270px;overflow:auto;padding-right:5px}.day-button{grid-template-columns:1fr;gap:2px;padding:8px 0}.day-button .date{font-size:11px}.day-button .name{font-size:11px}.rail-note{display:none}.filter{margin:10px 0}.toolbar{gap:9px;align-items:start}.tabs{gap:18px}.tab{font-size:13px}.quiet{white-space:nowrap;font-size:11px}.reading h2{font-size:25px}.lead{font-size:16px}.foot{display:block}.reading .eyebrow{font-size:11px}}
@media print{body{background:#fff;color:#111}.shell{padding:0;max-width:none}.rail,.toolbar,.prev-next,.skip{display:none}.layout{display:block}.reading{max-width:none}.masthead{padding-top:12px}.reading h2{font-size:23px}.chapter{break-inside:avoid}.foot{margin-top:20px}.issue{font-size:10px}a{color:inherit}}
</style>
</head>
<body>
<a class="skip" href="#reading">跳到日志正文</a>
<div class="shell">
  <header class="masthead"><div><div class="kicker">BUILD NOTES / XLeRobot</div><h1>制作日志</h1><p>每天推进了什么，什么还没完成，以及如何做得更好。</p></div><div class="issue">2026.10.20 — 2026.11.03<br><strong>09 个有记录日期 / 12 条会话</strong><br>截止 11.03 14:46 · 北京时间</div></header>
  <nav class="toolbar" aria-label="内容分类"><div class="tabs"><button class="tab" id="tab-days" aria-pressed="true">每日记录</button><button class="tab" id="tab-lessons" aria-pressed="false">经验整理</button><button class="tab" id="tab-sources" aria-pressed="false">来源与范围</button></div><button class="quiet" id="print">打印当前内容</button></nav>
  <div class="layout">
    <aside class="rail" aria-label="日期索引"><label class="search-label" for="search">检索标题、问题或经验<input id="search" type="search" placeholder="例如：抓取、限位、部署" autocomplete="off"></label><div class="filter"><button id="filter-all" aria-pressed="true">全部日期</button><button id="filter-recorded" aria-pressed="false">仅有记录</button></div><p id="result-count" aria-live="polite"></p><nav class="date-list" id="dates" aria-label="按日期选择"></nav><p class="rail-note">统一使用北京时间。留白表示没有找到当日记录，不代表没有活动。分叉继承不重复计算。</p></aside>
    <main class="reading" id="reading" aria-live="polite"></main>
  </div>
  <footer class="foot"><span>依据原始对话、项目台账与历史证据整理 · 保留失败与未完成项</span><span>XLeRobot / 制作与观察</span></footer>
</div>
<script id="journal-data" type="application/json">__JOURNAL_DATA__</script>
<script>
'use strict';
const journal=JSON.parse(document.getElementById('journal-data').textContent);
const reading=document.getElementById('reading');
const sourcesById=Object.fromEntries(journal.sources.map(s=>[s.id,s]));
let selected=journal.range_end,mode='days',recordedOnly=false;
const el=(tag,text,cls)=>{const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node};
function chapter(title,items){const section=el('section',undefined,'chapter');section.append(el('h3',title));if(Array.isArray(items)){const list=el('ul');items.forEach(item=>list.append(el('li',item)));section.append(list)}else section.append(el('p',items));reading.append(section);return section}
function sourceTags(ids){const group=el('div',undefined,'sources');ids.forEach(id=>{const b=el('button',id,'source-tag');b.type='button';b.setAttribute('aria-label',id+' '+sourcesById[id].title);b.onclick=()=>{setMode('sources');document.getElementById('source-'+id)?.scrollIntoView({block:'center',behavior:'smooth'})};group.append(b)});return group}
function drawIndex(){const query=document.getElementById('search').value.trim().toLowerCase();const days=journal.calendar.filter(day=>(!recordedOnly||!day.empty)&&JSON.stringify(day).toLowerCase().includes(query));const nav=document.getElementById('dates');nav.replaceChildren();days.slice().reverse().forEach(day=>{const button=el('button',undefined,'day-button'+(day.empty?' empty':''));button.type='button';button.dataset.date=day.date;if(day.date===selected&&mode==='days')button.setAttribute('aria-current','date');button.append(el('span',day.date,'date'),el('span',day.empty?'未找到当日记录':day.title,'name'));button.onclick=()=>{selected=day.date;setMode('days')};nav.append(button)});document.getElementById('result-count').textContent=days.length+' 个日期'+(query?'匹配检索':'');if(!days.length)nav.append(el('p','没有匹配的日期；可以修改关键词。','empty-note'))}
function renderDay(){const day=journal.calendar.find(d=>d.date===selected);reading.append(el('div',day.date+' / '+day.status,'eyebrow'),el('h2',day.title),el('p',day.summary,'lead'));if(day.empty){chapter('记录空白','此日期没有找到可归档的对话或台账条目。找到原始材料后再追加，保留当前空白。')}else{chapter('当天推进',day.progress);chapter('问题与失败',day.problems);const result=el('section',undefined,'outcome');result.append(el('h3','当日结果与边界'),el('p',day.outcome));reading.append(result);chapter('接下来',day.next);chapter('可复用经验',day.lessons);const refs=chapter('回查来源','');refs.append(sourceTags(day.sources));if(day.commits.length){const p=el('p','关键历史提交：'+day.commits.join(' · '));refs.append(p)}refs.append(el('p',day.evidence.join(' / '),'source-row'))}reading.append(el('p','对话截止 '+journal.cutoff+'（北京时间）。这是历史记录，后续事项不构成新的动作授权。','tail'));const navigation=el('nav',undefined,'prev-next');navigation.setAttribute('aria-label','相邻日期');const i=journal.calendar.findIndex(d=>d.date===selected);for(const [label,delta]of[['← 前一天',-1],['后一天 →',1]]){const b=el('button',label);b.type='button';b.disabled=!journal.calendar[i+delta];b.onclick=()=>{selected=journal.calendar[i+delta].date;setMode('days')};navigation.append(b)}reading.append(navigation)}
function renderLessons(){reading.append(el('div','EXPERIENCE / 12 NOTES','eyebrow'),el('h2','把成功和失败都留下来'),el('p','每条经验都保留问题、后来采用的做法和适用边界。这里的一次成功，不会被写成通用能力。','lead'));journal.lessons.forEach((note,i)=>{const s=el('section',undefined,'chapter');s.append(el('div',String(i+1).padStart(2,'0')+' / '+note.dates.join(' · '),'lesson-label'),el('h3',note.title),el('p',note.problem),el('p',note.method),el('p','适用边界：'+note.limit),sourceTags(note.sources));reading.append(s)});chapter('可以展开的分享线索',journal.story_outline)}
function renderSources(){reading.append(el('div','SOURCES / '+journal.cutoff,'eyebrow'),el('h2','每一个结论，都可以回到来源'),el('p','当前工作区的 7 条对话全部纳入，另收录 open-share 中与机器人、网络和归档相关的 5 条。原始记录和现场图片保留在私人备份；这里呈现整理后的内容。','lead'));const metrics=el('p',undefined,'metrics');metrics.append(el('b','12'),document.createTextNode(' 条会话 / '),el('b','150'),document.createTextNode(' 条用户消息 / '),el('b','15'),document.createTextNode(' 个连续日期'));reading.append(metrics);chapter('图片与原始证据',['33 个用户图片引用均有可读图像：27 个原文件、6 个从会话内嵌内容恢复的版本。后 6 个不能声称与已经失效的原文件字节相同。','同时保留两轮抓取的 474 张运行照片。原始对话包括工具记录与行内图像；分叉按原有字节边界恢复。']);chapter('范围与未完成项',['旧版 open-share 历史库还有 129 条失效路径索引，不能声称所有旧历史已经完全恢复。','本批截止时，快速抓取新一轮测试刚进入预检；后续完成情况需要下次追加。','本轮没有控制机器人或重新获取车载相机。支持证据来自已经在工作电脑上的材料。','原始快照之外另有 E 盘备份，以及另一块物理硬盘上的 G 盘副本；均保存在本机。']);journal.sources.forEach(source=>{const s=el('section',undefined,'chapter source-row');s.id='source-'+source.id;s.append(el('div',source.id+' / '+source.workspace,'lesson-label'),el('h3',source.title),el('code',source.thread),el('p',source.reason));if(source.parent)s.append(el('p','分叉来源 '+source.parent+'；继承前缀 '+source.inherited_records+' 条记录，日报不重复计入。'));reading.append(s)})}
function setMode(value){mode=value;reading.replaceChildren();for(const [id,name]of[['tab-days','days'],['tab-lessons','lessons'],['tab-sources','sources']])document.getElementById(id).setAttribute('aria-pressed',String(value===name));if(mode==='days')renderDay();else if(mode==='lessons')renderLessons();else renderSources();drawIndex();const hash=mode==='days'?selected:mode;if(location.hash.slice(1)!==hash)history.replaceState(null,'','#'+hash)}
document.getElementById('tab-days').onclick=()=>setMode('days');document.getElementById('tab-lessons').onclick=()=>setMode('lessons');document.getElementById('tab-sources').onclick=()=>setMode('sources');document.getElementById('filter-all').onclick=()=>{recordedOnly=false;document.getElementById('filter-all').setAttribute('aria-pressed','true');document.getElementById('filter-recorded').setAttribute('aria-pressed','false');drawIndex()};document.getElementById('filter-recorded').onclick=()=>{recordedOnly=true;document.getElementById('filter-all').setAttribute('aria-pressed','false');document.getElementById('filter-recorded').setAttribute('aria-pressed','true');drawIndex()};document.getElementById('search').addEventListener('input',drawIndex);document.getElementById('print').onclick=()=>window.print();const hash=location.hash.slice(1);if(journal.calendar.some(d=>d.date===hash))selected=hash;setMode(['lessons','sources'].includes(hash)?hash:'days');
</script>
</body>
</html>
